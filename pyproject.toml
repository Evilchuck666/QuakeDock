[project]
name = "quakedock"
dynamic = ["version"]
description = "Desktop installer and launcher for Quake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "tqdm>=4.67,<5",
    "certifi>=2025.1.31",
    "pywinpty>=3.0.5,<4; sys_platform == 'win32'",
]

[project.scripts]
quakedock = "quakedock.__main__:run"

[dependency-groups]
dev = ["PyInstaller>=6.16,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the version: bump it there before a release.
path = "src/quakedock/__init__.py"

[tool.hatch.build.targets.wheel]
# Editable install: the app keeps loading assets/ from the checkout.
packages = ["src/quakedock"]
