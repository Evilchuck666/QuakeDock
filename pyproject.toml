[project]
name = "quakedock"
version = "1.1.1"
description = "Desktop installer and launcher for Quake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "tqdm>=4.67,<5",
    "certifi>=2025.1.31",
    "pywinpty>=3.0.5,<4; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["PyInstaller>=6.16,<7"]

[project.scripts]
quakedock = "quakedock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable install: the app keeps loading assets from the checkout.
include = ["quakedock.py", "quake_gui", "quake_installer"]
