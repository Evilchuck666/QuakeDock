name: Build Qt6 desktop

# Every push and pull request runs only the jobs its changes need. "Run workflow" on
# main with a version (e.g. 1.0.0, matching src/quakedock/__init__.py and arch/PKGBUILD)
# builds everything, publishes a GitHub release with the four packages, uploads the
# wheel and the source distribution to PyPI (Trusted Publishing, environment "pypi")
# and pushes arch/PKGBUILD to the quakedock-bin AUR package (secret AUR_SSH_PRIVATE_KEY).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without v. Example: 1.0.0'
        required: true
        type: string

permissions:
  contents: read

# Use Node 24 for JavaScript actions, including transitive actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      build: ${{ steps.filter.outputs.build }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "src/**",
                  "assets/**",
                  "run.py",
                  "pyproject.toml",
                  "uv.lock",
                  ".python-version",
                  "scripts/build-*.sh",
                  "scripts/build-windows.ps1",
                  "scripts/build.py",
                  "scripts/QuakeDock.spec",
                  "scripts/requirements-*.txt",
                  "tests/**",
                  ".github/workflows/release.yaml"
                ],
                "exclude": [
                  "tests/**.md"
                ]
              },
              "build": {
                "include": [
                  "src/**",
                  "assets/**",
                  "run.py",
                  "pyproject.toml",
                  "uv.lock",
                  ".python-version",
                  "scripts/build-*.sh",
                  "scripts/build-windows.ps1",
                  "scripts/build.py",
                  "scripts/QuakeDock.spec",
                  "scripts/requirements-*.txt",
                  ".github/workflows/release.yaml"
                ],
                "exclude": []
              },
              "metadata": {
                "include": [
                  "README.md",
                  "TECHNICAL_GUIDE.md",
                  "LICENSE",
                  "pyproject.toml",
                  "arch/**"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  desktop:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.build == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      # Dependencies come from pip without installing the project: import it from src/.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-build.txt
            scripts/requirements-gui.txt
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 \
            xvfb xauth
      - run: python -m pip install -r scripts/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py --smoke-test
      - name: Build and verify the standalone package
        if: needs.changes.outputs.build == 'true'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) target=linux ;;
            Windows) target=windows ;;
            macOS) target=macos ;;
          esac
          python scripts/build.py --platform "$target"
      - name: Verify standalone X11 startup and shutdown (Linux)
        if: (needs.changes.outputs.build == 'true') && (runner.os == 'Linux')
        run: xvfb-run -a python -c 'from pathlib import Path; from scripts.build import verify; verify(Path("dist/QuakeDock"), qt_platform="xcb")'
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.build == 'true'
        with:
          name: QuakeDock-${{ matrix.os }}
          path: |
            dist/QuakeDock-*.tar.gz
            dist/QuakeDock-*.zip
          if-no-files-found: error
  release:
    name: Publish release
    needs: [desktop, python]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    concurrency:
      group: quakedock-release
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Usa una versión como 1.0.0, sin la v."
            exit 1
          fi

          package_version=$(sed -nE 's/^__version__ = "(.*)"/\1/p' src/quakedock/__init__.py)
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::src/quakedock/__init__.py dice $package_version. Súbela a $VERSION primero."
            exit 1
          fi

          pkgbuild_version=$(sed -nE 's/^pkgver=(.*)/\1/p' arch/PKGBUILD)
          if [[ "$pkgbuild_version" != "$VERSION" ]]; then
            echo "::error::arch/PKGBUILD dice $pkgbuild_version. Súbela a $VERSION primero."
            exit 1
          fi

          # Fetch existing tags. An API failure must stop publication.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" \
            --jq '.[].ref' > existing-tags.txt

          if grep -Fxq "refs/tags/v$VERSION" existing-tags.txt; then
            echo "::error::El tag v$VERSION ya existe. Usa otra versión."
            exit 1
          fi

      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: QuakeDock-*
          path: release-assets
          merge-multiple: true

      - name: Check packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          for file in \
            QuakeDock-linux-x64.tar.gz \
            QuakeDock-windows-x64.zip \
            QuakeDock-macos-x64.zip \
            QuakeDock-macos-arm64.zip
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::Falta el paquete $file o está vacío."
              exit 1
            fi
          done

          sha256sum \
            QuakeDock-linux-x64.tar.gz \
            QuakeDock-windows-x64.zip \
            QuakeDock-macos-x64.zip \
            QuakeDock-macos-arm64.zip \
            > SHA256SUMS.txt

      - name: Create tag and publish release
        shell: bash
        run: |
          set -euo pipefail

          gh release create "v$VERSION" \
            release-assets/QuakeDock-linux-x64.tar.gz \
            release-assets/QuakeDock-windows-x64.zip \
            release-assets/QuakeDock-macos-x64.zip \
            release-assets/QuakeDock-macos-arm64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "QuakeDock v$VERSION" \
            --generate-notes \
            --latest

  python:
    name: Python package
    needs: [changes]
    if: needs.changes.outputs.build == 'true' || needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-shape0 libxcb-keysyms1

      - name: Check documentation and package versions
        shell: python
        run: |
          import re
          from pathlib import Path

          spec = Path('scripts/QuakeDock.spec').read_text()
          for filename in ('README.md', 'TECHNICAL_GUIDE.md'):
              assert filename in spec, f'{filename} is missing from the build specification'
              assert Path(filename).read_text(encoding='utf-8').strip(), f'{filename} is empty'
          assert Path('LICENSE').read_text(encoding='utf-8').strip(), 'LICENSE is empty'

          version = re.search(r'^__version__ = "(.+)"$', Path('src/quakedock/__init__.py').read_text(), re.M)[1]
          pkgver = re.search(r'^pkgver=(.+)$', Path('arch/PKGBUILD').read_text(), re.M)[1]
          assert pkgver == version, f'arch/PKGBUILD has pkgver={pkgver}, the package is {version}'
          print(f'Version {version} in src/quakedock/__init__.py and arch/PKGBUILD')

      - name: Validate the build specification without compiling Qt
        run: python3 -m unittest discover -s tests -p test_build_spec.py -v

      - name: Build wheel and source distribution
        run: |
          uv build --clear
          uvx twine check --strict dist/*

      # The wheel must carry the files the app reads at run time, including the launchers.
      - name: Check the wheel contents
        shell: python
        run: |
          import glob
          import zipfile

          (wheel,) = glob.glob('dist/*.whl')
          names = zipfile.ZipFile(wheel).namelist()
          for folder in ('cfg', 'icons', 'links', 'scripts'):
              if not any(name.startswith(f'quakedock/assets/{folder}/') for name in names):
                  raise SystemExit(f'{wheel} has no quakedock/assets/{folder}')
          print(f'{wheel}: {len(names)} files')

      - name: Smoke test the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/quakedock --smoke-test
          wheel/bin/python -I -c "
          from quakedock.gui import library
          assert 'site-packages' in str(library.ASSETS), 'assets read from ' + str(library.ASSETS)
          assert library.vk_launcher.CONFIG_FILES and library.ez_launcher.CONFIG_FILES
          print('Installed wheel reads its files from', library.ASSETS)
          "

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/quakedock/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      # No API token: PyPI trusts this workflow file and environment directly.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the AUR_SSH_PRIVATE_KEY secret to update the AUR package."
            exit 1
          fi

      - name: Set up SSH and git
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh pacman-contrib
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Pinned AUR host keys, see https://aur.archlinux.org
          cat > "$ssh_dir/known_hosts" << 'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          # Inside a container HOME is /github/home but ssh reads ~/.ssh from
          # /etc/passwd (/root), so pass the key and host keys explicitly.
          echo "GIT_SSH_COMMAND=ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config --global user.name "Evilchuck666"
          git config --global user.email "carlos.martinez.medina1992@gmail.com"
          # The first clone of a new AUR package is empty; the AUR only accepts master.
          git config --global init.defaultBranch master

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: repo

      # arch/PKGBUILD is the source of truth: copy it over the AUR one with pkgrel
      # reset to 1, fill in the checksums of the release just published, check that
      # it builds and regenerate .SRCINFO. makepkg refuses root.
      - name: Push PKGBUILD to the AUR
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/quakedock-bin.git aur
          useradd -m builder
          cp repo/arch/PKGBUILD repo/arch/quakedock.desktop aur/
          cd aur
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          su builder -c 'updpkgsums'
          su builder -c 'makepkg --nodeps --force --noconfirm'
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO quakedock.desktop
          if git diff --cached --quiet; then
            echo "AUR package is already at $VERSION."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master

  result:
    name: CI result
    if: always()
    needs: [changes, desktop, python, release, pypi, aur]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
