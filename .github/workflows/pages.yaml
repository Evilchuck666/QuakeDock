name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.py'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check-site.py'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: project-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate project page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public files and links
        shell: bash
        run: |
          python3 scripts/check-site.py
      # Upload here and deploy in the next job: deploy-pages can miss an artifact
      # uploaded a second earlier in the same job. The name is per attempt, so
      # "Re-run all jobs" doesn't leave two artifacts with one name, and the deploy
      # job reads it from this job's outputs, so "Re-run failed jobs" still finds it.
      - name: Name the page artifact
        id: artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: site
          include-hidden-files: true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.validate.outputs.artifact }}
